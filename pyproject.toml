[project]
name = "uniflow"
version = "0.1.0"
description = "Toy benchmark for Gaussian versus Uniform RF distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
    "POT>=0.9.6",
    "torch>=2.0",
]

[project.optional-dependencies]
# The image-space extension loads its dataset through torchvision.
cifar10 = ["torchvision>=0.15", "lpips>=0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "toy*", "cifar10*"]
